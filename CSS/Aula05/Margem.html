<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Aplicação de margens</title>
    <style>
        .externa {
            background-color: burlywood;
            border: 2px black solid;
            font-size:50px;
            margin: 30px;
            padding: 30px;
        }
        .interna {
            background-color: burlywood;
            border: 2px black solid;
            font-size:50px;
            margin: 30px;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="externa">
        <div class="interna">
            Aplicação de margens internas e externas
        </div>
    </div>
</body>
</html>
