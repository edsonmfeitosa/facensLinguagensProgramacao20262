<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Floating</title>
</head>
<style>
    .conteudo2 {
        background-color: #a74949;
        width: 250px;
        height: 250px;
        border : 1px black solid;
        color: antiquewhite;
        font-size: 30px;
        margin: 5px;
        float: left;
    }
    .conteudo {
        background-color: blue;
        width: 150px;
        height: 150px;
        border : 1px black solid;
        float: right;
    }
    p{
        clear: both;
    }
</style>
<body>
    <div class="conteudo">Conteúdo 1</div>
    <div class="conteudo2">Conteúdo 2</div>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Eligendi totam ut rerum, pariatur, illo dolor voluptatum dignissimos a eius, doloribus doloremque laboriosam illum quas tempora magni. Alias harum natus eligendi.</p>
    <div class="conteudo2">Conteúdo 3</div>
    <div class="conteudo2">Conteúdo 4</div>
</body>
</html>
