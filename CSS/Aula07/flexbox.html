<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula sobre flexbox</title>
</head>
<style>
    .container{
        width: 400px;
        height: 260px;
        border: 2px red solid;
        /* propriedades do flexbox */
        display: flex;
        /* trocar os eixos */
        flex-direction: column;
        flex-direction: column-reverse;
        flex-direction: row-reverse;
        flex-direction: row;
        /* pular linha */
        flex-wrap: wrap;
        flex-wrap: wrap-reverse;
        /* se comporta como flex-direction e flex-wrap */
        flex-flow: column;
        flex-flow: column wrap;
        flex-flow: row wrap;
        /* alterar os flex item  */
        justify-content: flex-start;
        justify-content: flex-end;
        justify-content: center;
        justify-content: space-around;
        justify-content: space-between;
        justify-content: space-evenly;
        /* alinhamento no eixo secundário */
        align-items: flex-start;
        align-items: center;
    }
    .item {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        align-self: flex-start;
    }
    .item2 {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        justify-self: center;
        align-self: center;
    }
    .item3 {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        justify-self: flex-end;
        align-self: flex-end;
    }
    .container2 {
         width: 400px;
        height: 260px;
        border: 2px red solid;
        display: flex;
        justify-content: space-around;
        /* align-items: center;
        align-items: flex-start; */
    }
    .container3 {
         width: 400px;
        height: 260px;
        border: 2px red solid;
        display: flex;
        gap: 20px;
    }
    .item4 {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        order: 0;
    }
    .item5 {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        order: 2;
        flex-grow: 2;
    }
    .item6 {
        background-color: cornflowerblue;
        font-size: 30px;
        width: 70px;
        border: 1px black solid;
        order: -1;
    }
</style>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div>
    <br>
    <div class="container2">
        <div class="item">8</div>
        <div class="item2">9</div>
        <div class="item3">10</div>
    </div>
    <br>
    <div class="container3">
        <div class="item4">11</div>
        <div class="item5">12</div>
        <div class="item6">13</div>
    </div>
</body>
</html>
