<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax - Menu de opções</title>
</head>
<body>
    <h1>Ajax - Menu de opções</h1>
    <ul>
        <li><a href="../../HTML/Aula03/tabela.html">Tabela</a></li>
        <li><a href="../../HTML/Aula03/Imagem.html">Imagem</a></li>
        <li><a href="../../CSS/Aula07/flexbox.html">Flexbox</a></li>
        <li><a href="../../HTML/Aula04/FormularioCompleto.html">Formulário</a></li>
    </ul>
    <div class="conteudo">

    </div>
</body>
<script>
    //abrir o conteúdo do link na div conteudo
    const links = document.querySelectorAll('a');
    const conteudo = document.querySelector('.conteudo');

    links.forEach(link => {
        link.addEventListener('click', (event) => {
            event.preventDefault();
            const url = link.href;
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    conteudo.innerHTML = data;
                });
        });
    });
</script>
</html>
