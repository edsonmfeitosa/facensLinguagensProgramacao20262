<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX - Consulta CEP</title>
</head>
<body>
    <h1>AJAX - Consulta CEP</h1>
    <form>
        <fieldset>
            <legend>Consulta endereço</legend>
            <label for="cep">Digite o CEP</label>
            <input type="text" name="cep" id="cep">
            <button onclick="pesquisar(event)">Consultar</button>
        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>Endereço</legend>
            <p class="carregar" style="color: red; visibility: hidden;">
                Carregando...
            </p>
            <p>
                <label for="endereco">Endereço:</label>
                <input type="text" name="endereco" id="endereco">
            </p>
            <p>
                <label for="bairro">Bairro:</label>
                <input type="text" name="bairro" id="bairro">
            </p>
            <p>
                <label for="estado">Estado:</label>
                <input type="text" name="estado" id="estado">
            </p>
        </fieldset>
    </form>
</body>
<!-- <script src="asyncAwait.js"></script> -->
 <script src="promise.js"></script>
</html>
