<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
</head>
<body>
    <form action="https://6a99f38e9a7ec1b817d1fd9b.mockapi.io/pessoa" method="post">
        <fieldset>
            <legend>Cadastro de Pessoa</legend>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" required>
            </p>
            <p>
                <label for="altura">Altura:</label>
                <input type="number" name="altura" id="altura" min="0" max="3" step="0.1">
            </p>
            <p>
                <label for="corDosOlhos">Cor dos Olhos:</label>
                <input type="color" name="corDosOlhos" id="corDosOlhos">
            </p>
            <p>
                <label for="dataDeNascimento">Data de Nascimento:</label>
                <input type="date" name="dataDeNascimento" id="dataDeNascimento">
            </p>
            <p>
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha">
            </p>
            <p>
                <label for="genero">Gênero:</label>
                <input type="radio" name="genero" id="masculino" value="m">
                <label for="masculino">Masculino</label>
                <input type="radio" name="genero" id="feminino" value="f">
                <label for="feminino">Feminino</label>
            </p>
            <p>
                <label for="gostaDe">Gosta de:</label>
                <input type="checkbox" name="ler" id="ler" value="ler">
                <label for="ler">Ler</label>
                <input type="checkbox" name="esportes" id="esporte" value="esporte">
                <label for="esportes">Esportes</label>
                <input type="checkbox" name="musica" id="musica" value="musica">
                <label for="musica">Música</label>
            </p>
            <p>
                <label for="uploadRG">Upload do RG:</label>
                <input type="file" name="uploadRG" id="uploadRG">
            </p>
            <p>
                <label for="estado">Estado:</label>
                <select name="estado" id="estado">
                    <option value="">Selecione um estado</option>
                    <optgroup label="Região Sudeste">
                        <option value="sp">São Paulo</option>
                        <option value="rj">Rio de Janeiro</option>
                        <option value="mg">Minas Gerais</option>
                    </optgroup>
                    <optgroup label="Região Sul">
                        <option value="rs">Rio Grande do Sul</option>
                        <option value="sc">Santa Catarina</option>
                        <option value="pr">Paraná</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </p>
        </fieldset>
    </form>
</body>
</html>
