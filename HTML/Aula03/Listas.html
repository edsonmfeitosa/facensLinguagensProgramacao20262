<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Listas</title>
</head>
<body>
    <h1>HTML - Listas</h1>
    <h2>Lista não ordenada</h2>
    <ul>
        <li>maça</li>
        <li>banana</li>
        <li>pera</li>
    </ul>
    <h2>Lista ordenada</h2>
    <ol>
        <li>Edson</li>
        <li>Maria</li>
        <li>João</li>
    </ol>
    <h2>Lista de definição</h2>
    <dl>
        <dt>Café</dt>     
        <dd>pó</dd>
        <dd>água</dd>
        <dd>açucar</dd>
        <dt>suco de limão</dt>
        <dd>água</dd>
        <dd>açucar</dd>
        <dd>limão</dd>
    </dl>
</body>
</html>
