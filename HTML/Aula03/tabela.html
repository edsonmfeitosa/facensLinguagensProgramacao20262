<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Tabela</title>
</head>
<body>
    <h1>Exemplo de tabela no HTML</h1>
    <p>
        <table border="1" cellpadding="5" cellspacing="0">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Sexo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">1</td>
                    <td>João</td>
                    <td>25</td>
                    <td>Masculino</td>
                </tr>
                <tr>
                    <td>Maria</td>
                    <td>30</td>
                    <td>Feminino</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Pedro</td>
                    <td>28</td>
                    <td>Masculino</td>
                </tr>
                <tr>
                    <td colspan="3">Total</td>
                    <td>50</td>
                </tr>
            </tbody>
        </table>
    </p>
</body>
</html>
